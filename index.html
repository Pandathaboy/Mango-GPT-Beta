<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥭 Mango GPT</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffb347,#ffd54f);
}

.header{
    background:#ff8c00;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

.chat{
    height:70vh;
    overflow-y:auto;
    padding:15px;
}

.bot{
    background:white;
    padding:12px;
    border-radius:15px;
    margin:10px;
    max-width:75%;
}

.user{
    background:#d4ffd4;
    padding:12px;
    border-radius:15px;
    margin:10px;
    margin-left:auto;
    width:fit-content;
    max-width:75%;
}

.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    background:white;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
    border:none;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:15px 25px;
    font-size:18px;
}
</style>

</head>
<body>

<div class="header">
🥭 Mango GPT
</div>

<div class="chat" id="chat">

<div class="bot">
👋 Yo! I'm Mango GPT.

Ask me anything!
</div>

</div>

<div class="bottom">
<input id="question" placeholder="Ask Mango GPT...">
<button onclick="askQuestion()">Ask</button>
</div>

<script>

async function askQuestion() {

const input =
document.getElementById("question");

const question =
input.value.trim();

if(question === "") return;

const chat =
document.getElementById("chat");

chat.innerHTML +=
`<div class="user">${question}</div>`;

chat.innerHTML +=
`<div class="bot">🔍 Searching...</div>`;

chat.scrollTop = chat.scrollHeight;

try {

const response = await fetch(
"https://mango-gpt-worker.harrybrine54.workers.dev",
{
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
question: question
})
}
);

const data =
await response.json();

const bots =
document.querySelectorAll(".bot");

bots[bots.length - 1].innerHTML =
data.answer;

}
catch(error){

const bots =
document.querySelectorAll(".bot");

bots[bots.length - 1].innerHTML =
"Shiiiii idk 🤷🥭";

}

input.value = "";

chat.scrollTop = chat.scrollHeight;

}

document
.getElementById("question")
.addEventListener("keydown", function(e){

if(e.key === "Enter"){
askQuestion();
}

});

</script>

</body>
</html>
