<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mango GPT 🥭</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffae42,#ffd75e);
    min-height:100vh;
}

.header{
    background:#ff8c00;
    color:white;
    text-align:center;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.subtitle{
    font-size:14px;
    margin-top:5px;
    font-weight:normal;
}

.chat{
    height:70vh;
    overflow-y:auto;
    padding:15px 15px 90px 15px;
}

.bot{
    background:white;
    padding:12px;
    border-radius:15px;
    margin:10px;
    max-width:75%;
    width:fit-content;
    word-wrap:break-word;
}

.user{
    background:#d4ffd4;
    padding:12px;
    border-radius:15px;
    margin:10px;
    margin-left:auto;
    width:fit-content;
    max-width:75%;
    word-wrap:break-word;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
    background:white;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
    border:none;
    outline:none;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:15px 25px;
    font-size:18px;
    cursor:pointer;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}
</style>
</head>

<body>

<div class="header">
🥭 Mango GPT
<div class="subtitle">
Smart enough to help. Honest enough to say "Shiiiii idk."
</div>
</div>

<div class="chat" id="chat">
    <div class="bot">
        👋 Yo! I'm Mango GPT 🥭<br>
        Ask me anything!
    </div>
</div>

<div class="bottom">
    <input id="question" placeholder="Ask Mango GPT..." autocomplete="off">
    <button id="askBtn" onclick="askQuestion()">Ask</button>
</div>

<script>

const WORKER_URL = "https://mango-gpt-worker.harrybrine54.workers.dev";

// Offline answers (used if the worker fails)
function getAnswer(q){

    q = q.toLowerCase();

    if(
        q.includes("quantum") ||
        q.includes("string theory") ||
        q.includes("advanced calculus")
    ){
        return "Shiiiii idk 🤷🥭";
    }

    if(/\b(hi|hello|hey)\b/.test(q)){
        return "What's good? 😎🥭";
    }

    if(q.includes("your name")){
        return "I'm Mango GPT 🥭";
    }

    if(q.includes("joke")){
        return "Why did the mango become a programmer? Because it liked branching out! 🥭😂";
    }

    if(q.includes("gravity")){
        return "Gravity pulls things together.";
    }

    if(q.includes("sun")){
        return "The Sun is a star.";
    }

    if(q.includes("earth")){
        return "Earth is the planet we live on.";
    }

    if(q.includes("capital of france")){
        return "Paris 🇫🇷";
    }

    if(q.includes("2+2")){
        return "4 😎";
    }

    return "🤔 I'm still learning. My mango guess is that it's about: " + q;
}

// Safely add a message bubble (no HTML injection)
function addMessage(text, type){
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function askQuestion(){

    const input = document.getElementById("question");
    const btn = document.getElementById("askBtn");
    const question = input.value.trim();

    if(question === "") return;

    // Clear box right away and lock the button
    input.value = "";
    btn.disabled = true;

    addMessage(question, "user");
    const botBubble = addMessage("🔍 Searching...", "bot");

    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);

        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: question }),
            signal: controller.signal
        });

        clearTimeout(timeout);

        if(!response.ok) throw new Error("Bad response");

        const data = await response.json();

        if(!data.answer) throw new Error("No answer");

        botBubble.textContent = data.answer;
    }
    catch(err){
        // Worker failed, so use the offline answers
        botBubble.textContent = getAnswer(question);
    }

    btn.disabled = false;
    input.focus();
    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
}

document.getElementById("question").addEventListener("keydown", function(event){
    if(event.key === "Enter"){
        askQuestion();
    }
});

</script>

</body>
</html>
